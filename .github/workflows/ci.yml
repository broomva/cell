name: ci

on:
  pull_request:
    # `edited` re-runs the slop gate when the PR body (its evidence) changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EVE_TELEMETRY_DISABLED: "1"
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    name: verify (types · lint · tests + coverage floor · grep gate · audit · build · mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: lint (biome ci)
        run: bun run lint
      - name: tests, with the coverage floor in bunfig.toml
        run: bun run test
      - name: grep gate (ANTHROPIC_ only in the provider)
        run: scripts/grep-gate.sh
      - name: dependency audit
        run: bun run audit
      - name: eve build (fake loopback env; never calls out)
        run: bun run build:fake
      - name: mutation gate (the tests must kill every mutant)
        run: bun run mutate

  slop:
    name: slop gate (diff rules · pins · source needs a test · PR evidence)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: slop gate
        env:
          # Passed through the environment, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        # The checkout is the PR's merge ref; its first parent is the base
        # branch as merged, which pull_request.base.sha can lag behind.
        run: bun run slop HEAD^1

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary, checksum-pinned: no API token, no PR-commit listing, every commit scanned.
      - name: install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: gitleaks detect (all history)
        run: ./gitleaks detect --redact --no-banner --exit-code 1

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint -color

  # Blocks every PR while main's ruleset is incomplete. This copy runs PR code,
  # so a PR that also edits scripts/ruleset-check.ts could silence it; that
  # edit is guarded, and gate-guard runs main's copy of the same check.
  ruleset:
    name: ruleset (main requires gate and gate-guard, bound to Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/ruleset-check.ts

  gate:
    # The one required check: green only when every job above is green
    # (slop is skipped on push to main, and a skip counts as a pass there only).
    name: gate
    if: always()
    needs: [verify, slop, secrets, actionlint, ruleset]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -e --arg ev "$EVENT" '
            to_entries | all(
              .value.result == "success"
              or (.key == "slop" and $ev != "pull_request" and .value.result == "skipped")
            )'
