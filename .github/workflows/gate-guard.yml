name: gate-guard

# Runs main's copy of this workflow and of scripts/gate-guard.ts, never the
# PR's: a PR that edits the gates cannot edit the check that catches it.
# It reads the PR through the API and never checks out or executes PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-guard:
    name: gate-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default checkout under pull_request_target is the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/gate-guard.ts
