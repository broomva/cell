version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Match the local registry age gate: nothing younger than a week.
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      eve-and-ai-sdk:
        patterns: ["eve", "ai", "@ai-sdk/*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
